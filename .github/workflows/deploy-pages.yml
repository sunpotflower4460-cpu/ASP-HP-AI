name: deploy-pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'data/offers/**'
      - 'data/site.json'
      - 'data/pages.json'
      - 'data/decision-tags.json'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate launch prerequisites
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_READY: ${{ vars.PUBLIC_READY }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          READINESS_STRICT: 'true'
        run: npm run readiness
      - name: Build production site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_READY: ${{ vars.PUBLIC_READY }}
        run: npm run build
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Submit sitemap to Search Console
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_READY: ${{ vars.PUBLIC_READY }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: npm run gsc:submit
