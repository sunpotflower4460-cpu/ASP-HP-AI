name: daily-analysis
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
permissions:
  contents: write
jobs:
  analyze:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch Search Console
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: npm run gsc:fetch
      - name: Fetch ValueCommerce revenue
        env:
          VALUECOMMERCE_CLIENT_KEY: ${{ secrets.VALUECOMMERCE_CLIENT_KEY }}
          VALUECOMMERCE_CLIENT_SECRET: ${{ secrets.VALUECOMMERCE_CLIENT_SECRET }}
          VALUECOMMERCE_LOOKBACK_DAYS: 30
        run: npm run vc:fetch
      - run: npm run affiliate:normalize
      - run: npm run analyze
      - run: npm run editor:plan
      - name: Optional low-cost AI editor
        env:
          AI_EDITOR_ENABLED: ${{ vars.AI_EDITOR_ENABLED }}
          EDITOR_AUTO_APPLY_TITLE: ${{ vars.EDITOR_AUTO_APPLY_TITLE }}
          ALLOW_PAID_AI: 'false'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
        run: npm run editor:ai
      - name: Apply explicitly enabled safe title proposals
        env:
          EDITOR_AUTO_APPLY_TITLE: ${{ vars.EDITOR_AUTO_APPLY_TITLE }}
        run: npm run editor:apply
      - run: npm run validate
      - run: npm run freshness
      - run: npm run check
      - run: npm run build
      - name: Store observations and allowed safe edits
        shell: bash
        run: |
          git config user.name "asp-hp-ai-bot"
          git config user.email "asp-hp-ai-bot@users.noreply.github.com"
          for p in \
            data/search-console/latest.json \
            data/affiliate/valuecommerce-latest.json \
            data/affiliate/normalized-latest.json \
            reports/latest.json \
            reports/editor-plan.json \
            reports/ai-editor-proposal.json; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          git add -- src/pages
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update autonomous site observations"
          git push
