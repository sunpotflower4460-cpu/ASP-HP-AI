name: daily-analysis
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
permissions:
  contents: write
jobs:
  analyze:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Fetch Search Console
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: npm run gsc:fetch
      - run: npm run analyze
      - name: Store observation snapshot
        run: |
          git config user.name "asp-hp-ai-bot"
          git config user.email "asp-hp-ai-bot@users.noreply.github.com"
          git add -- data/search-console/latest.json reports/latest.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update daily search observations"
          git push
